<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --series-matija: #2a78d6;
    --series-matea: #eb6834;
    --good: #0ca30c;
    --warning: #b8790f;
    --serious: #c15a36;
    --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  header.app-header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(252,252,251,0.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-badge {
    width: 36px; height: 36px; border-radius: 10px; background: var(--series-matija);
    color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.2; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--page); }

  .who-chip { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .who-chip .dot { width: 9px; height: 9px; border-radius: 50%; }

  /* Hamburger trigger — desktop only (bottom nav takes over on mobile) */
  .sidebar-trigger { display: flex; }
  @media (max-width: 767px) { .sidebar-trigger { display: none; } }

  /* Left sidebar (desktop) */
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 35; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: 260px; background: var(--surface-1);
    border-right: 1px solid var(--border); z-index: 40; display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.08);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav button {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: none;
    background: none; font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; text-align: left; width: 100%;
  }
  .sidebar-nav button:hover { background: var(--page); }
  .sidebar-nav button.active { background: var(--page); color: var(--text-primary); }
  .sidebar-nav button.active svg { color: var(--series-matija); }

  /* Bottom tab bar (mobile) — visina = 60px sadržaja + dodatni safe-area
     prostor (home indicator na iPhoneu), tako da safe-area padding NE
     "jede" prostor ikonicama nego se dodaje preko njih. */
  .bottom-nav {
    display: none; position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(60px + env(safe-area-inset-bottom)); background: var(--surface-1);
    border-top: 1px solid var(--border); align-items: center; justify-content: space-around; z-index: 15;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (max-width: 767px) { .bottom-nav { display: flex; } }
  .bottom-nav button {
    background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; color: var(--text-muted); font-family: inherit; cursor: pointer; flex: 1; padding: 6px 0;
  }
  .bottom-nav button.active { color: var(--series-matija); }
  .bottom-nav .fab {
    width: 44px; height: 44px; border-radius: 50%; background: var(--series-matija); color: #fff;
    display: flex; align-items: center; justify-content: center; margin-top: -20px;
    box-shadow: 0 4px 10px rgba(42,120,214,0.4);
  }
  .bottom-nav .fab-label { margin-top: 1px; }

  main { padding: 24px 0 64px; display: flex; flex-direction: column; gap: 24px; }
  @media (max-width: 767px) { main.with-bottom-nav { padding-bottom: calc(88px + env(safe-area-inset-bottom)); } }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; box-shadow: 0 1px 2px rgba(11,11,11,0.03);
  }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; }
  .section-title { margin: 0 0 12px; font-size: 13px; font-weight: 600; }

  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .field input, .field select {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
    padding: 9px 10px; font-size: 16px; color: var(--text-primary); outline: none; font-family: inherit; width: 100%;
  }
  /* font-size mora biti >=16px na inputima — ispod toga iOS Safari
     automatski zumira stranicu kad korisnik dodirne polje za unos. */
  .field input:focus, .field select:focus { border-color: var(--series-matija); }
  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--series-matija); color: #fff; border: none; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .btn-primary:hover { opacity: .92; }
  .btn-secondary {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .btn-secondary:hover { background: var(--page); }
  .btn-danger { color: var(--critical); }
  .form-error { margin: 8px 0 0; font-size: 12px; color: var(--critical); }

  /* Centered screens: profile picker + setup wizard */
  .center-screen { min-height: calc(100vh - 65px); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .center-card { width: 100%; max-width: 440px; }
  .center-card h1 { font-size: 19px; margin: 0 0 4px; text-align: center; }
  .center-card > p.sub { text-align: center; color: var(--text-muted); font-size: 13px; margin: 0 0 24px; }

  .picker-options { display: flex; flex-direction: column; gap: 12px; }
  .picker-option {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .picker-option:hover { border-color: var(--series-matija); box-shadow: 0 2px 10px rgba(11,11,11,0.06); }
  .picker-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; font-weight: 600; flex-shrink: 0; }
  .picker-option .meta { display: flex; flex-direction: column; }
  .picker-option .meta strong { font-size: 14px; color: var(--text-primary); }
  .picker-option .meta span { font-size: 12px; color: var(--text-muted); }

  .wizard-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
  .wizard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  .wizard-section-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em;
    margin: 18px 0 10px; }
  .wizard-section-label:first-of-type { margin-top: 4px; }

  /* Trend chart */
  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .metric-tabs { display: flex; gap: 4px; flex-wrap: wrap; background: var(--page); border-radius: 999px; padding: 3px; }
  .metric-tabs button {
    border: none; background: none; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--text-secondary);
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  .metric-tabs button.active { background: var(--surface-2); color: var(--text-primary); box-shadow: 0 1px 2px rgba(11,11,11,0.08); }
  .chart-empty { padding: 40px 0; text-align: center; color: var(--text-muted); font-size: 13px; }
  .chart-wrap { position: relative; padding-top: 6px; }
  .chart-wrap svg { display: block; width: 100%; height: 260px; overflow: visible; }
  .chart-point { cursor: pointer; }
  #chart-tooltip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 2px 8px rgba(11,11,11,0.12);
    display: none; white-space: nowrap; z-index: 5;
  }
  #chart-tooltip .tt-date { font-weight: 600; margin-bottom: 2px; }
  #chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  #chart-tooltip .tt-val { font-weight: 600; color: var(--text-primary); }

  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

  .muted { color: var(--text-muted); font-size: 13px; }

  .new-entry-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .new-entry-bar p { margin: 0; font-size: 12px; color: var(--text-muted); }

  .goal-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .goal-current { font-size: 24px; font-weight: 600; }
  .goal-current small { font-size: 13px; font-weight: 400; color: var(--text-muted); }
  .goal-start { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }
  .goal-target { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
  .progress-track { height: 8px; width: 100%; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; transition: width .25s; }
  .goal-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  .goal-eta { margin: 8px 0 0; font-size: 12px; color: var(--text-muted); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-tile { background: var(--page); border-radius: 12px; padding: 10px 12px; }
  .stat-tile .stat-label { margin: 0 0 4px; font-size: 11px; color: var(--text-muted); }
  .stat-tile .stat-value { font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .status-line { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; margin-top: 3px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stats-count { margin: 10px 0 0; font-size: 12px; color: var(--text-muted); }

  table.history { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.history th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  table.history td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--grid); color: var(--text-secondary); white-space: nowrap; }
  table.history tr:last-child td { border-bottom: none; }
  .row-weight { font-weight: 600; color: var(--text-primary); }
  .table-scroll { overflow-x: auto; }
  .table-empty { padding: 24px 0; text-align: center; color: var(--text-muted); font-size: 13px; }
  .lock-note { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 20;
  }
  .modal { width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; background: var(--surface-2);
    border-radius: 16px; padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.18); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-sub { margin: 0 0 16px; font-size: 12px; color: var(--text-muted); }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-note {
    font-size: 12px; color: var(--text-muted); background: var(--page); border: 1px dashed var(--border);
    border-radius: 10px; padding: 8px 12px; margin-top: 14px;
  }

  /* Profil tab */
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .profile-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 600; flex-shrink: 0; }
  .profile-head strong { font-size: 16px; display: block; }
  .profile-head span { font-size: 12px; color: var(--text-muted); }
  .profile-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
  .profile-meta .stat-tile .stat-label { margin: 0 0 4px; }

  /* Kreiraj jelo tab */
  .choice-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .choice-pills button {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 8px 14px;
    font-size: 12.5px; font-weight: 500; color: var(--text-secondary); cursor: pointer; font-family: inherit;
  }
  .choice-pills button.active { background: var(--series-matija); border-color: var(--series-matija); color: #fff; }
  .ingredient-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .ingredient-list li {
    display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-secondary);
    padding: 9px 11px; background: var(--page); border-radius: 8px;
  }
  .ingredient-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--series-matija); flex-shrink: 0; }

  .meal-option-list { display: flex; flex-direction: column; gap: 8px; }

  /* =========================================================================
   * STATE — dva odvojena računa. Firestore (accounts/matija, accounts/matea)
   * je izvor istine i drži podatke trajno; state.accounts je lokalna kopija
   * koju drži sinkroniziranu FIREBASE SYNC blok ispod (onSnapshot). Render
   * funkcije rade jednako kao i prije — samo se sad mijenja odakle podaci
   * dolaze, ne kako se prikazuju.
   * =======================================================================*/

  /* =========================================================================
   * FIREBASE SYNC — anonimna prijava + pretplata (onSnapshot) na oba
   * računa, tako da se promjene s bilo kojeg uređaja (tvog ili suprugina)
   * pojave uživo na oba. Pisanja (saveAccount) prvo ažuriraju lokalni
   * state za brz odziv, pa šalju izmjenu u Firestore; snapshot listener
   * odmah zatim potvrdi/uskladi sa serverom.
   * =======================================================================*/
  var db = null;

  function initFirebaseSync() {
    if (typeof firebase === "undefined" || typeof FIREBASE_CONFIG === "undefined") {
      state.syncError = "Firebase SDK se nije učitao (provjeri internetsku vezu).";
      render();
      return;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
    } catch (e) {
      // već inicijalizirano — u redu je, samo nastavi
    }
    db = firebase.firestore();
    // Uključi lokalno IndexedDB predmemoriranje — kod ponovnog otvaranja appa
    // (isti preglednik/uređaj) podaci se odmah prikažu iz predmemorije dok se
    // u pozadini sinkronizira sa serverom, umjesto da se svaki put čeka mrežni
    // odgovor prije prikaza ičega. Ako je otvoreno u više tabova odjednom, ova
    // značajka se tiho isključi (failed-precondition) — app radi dalje normalno.
    try { db.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
    // Lokalni razvoj/testiranje preko Firebase emulatora (firebase emulators:start) —
    // na pravom hostingu (GitHub Pages i sl.) ovo se nikad ne aktivira.
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      try {
        db.useEmulator("localhost", 8080);
        firebase.auth().useEmulator("http://localhost:9099", { disableWarnings: true });
      } catch (e) {}
    }
    firebase.auth().onAuthStateChanged(function (user) {
      if (!user) return;
      state.syncReady = true;
      ["matija", "matea"].forEach(function (accId) {
        db.collection("accounts").doc(accId).onSnapshot(
          function (doc) {
            var data = doc.data() || {};
            var acc = state.accounts[accId];
            acc.setup = data.setup || null;
            acc.entries = data.entries || [];
            state.syncError = null;
            render();
          },
          function (err) {
            state.syncError = "Greška pri sinkronizaciji (" + accId + "): " + (err && err.message ? err.message : err);
            render();
          }
        );
      });
      render();
    });
    firebase.auth().signInAnonymously().catch(function (err) {
      state.syncError = "Prijava nije uspjela: " + (err && err.message ? err.message : err) +
        ". Provjeri je li 'Anonymous' uključen u Firebase Console → Authentication → Sign-in method.";
      render();
    });
  }

  // Spremi djelomičnu izmjenu (patch) računa u Firestore. merge:true znači
  // da se mijenjaju samo navedena polja, ostatak dokumenta ostaje netaknut.
  function saveAccount(accId, patch) {
    if (!db) { state.syncError = "Nema veze s bazom — izmjena nije spremljena."; render(); return; }
    db.collection("accounts").doc(accId).set(patch, { merge: true }).catch(function (err) {
      state.syncError = "Spremanje nije uspjelo: " + (err && err.message ? err.message : err);
      render();
    });
  }

  /* =========================================================================
   * RENDER: Trend chart (ručno rađen SVG line chart, po odabranoj mjeri)
   * =======================================================================*/
  function renderTrendChart(acc) {
    var metric = METRICS.filter(function (m) { return m.key === state.chartMetric; })[0];
    var tabs = METRICS.map(function (m) {
      return '<button class="' + (m.key === metric.key ? "active" : "") + '" data-action="chart-metric" data-id="' + m.key + '">' + m.label + "</button>";
    }).join("");
    var head = '<div class="chart-head"><h2 style="margin:0">Trend</h2><div class="metric-tabs">' + tabs + "</div></div>";

    var points = sortedEntries(acc.entries).filter(function (e) { return e[metric.key] != null; });
    if (points.length === 0) {
      return '<section class="card">' + head + '<p class="chart-empty">Još nema podataka za ' + metric.label.toLowerCase() + ".</p></section>";
    }

    var dates = points.map(function (e) { return parseISO(e.date).getTime(); });
    var minDate = Math.min.apply(null, dates), maxDate = Math.max.apply(null, dates);
    if (minDate === maxDate) { minDate -= 86400000 * 3; maxDate += 86400000 * 3; }

    var values = points.map(function (e) { return e[metric.key]; });
    var minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
    var padV = Math.max((maxV - minV) * 0.2, metric.key === "weight" ? 1.5 : 1);
    var yMin = Math.floor(minV - padV), yMax = Math.ceil(maxV + padV);
    if (yMin === yMax) { yMin -= 1; yMax += 1; }

    var W = 720, H = 260, padL = 34, padR = 10, padT = 10, padB = 26;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    function xScale(t) { return padL + ((t - minDate) / (maxDate - minDate)) * innerW; }
    function yScale(v) { return padT + (1 - (v - yMin) / (yMax - yMin)) * innerH; }

    var yTicks = [];
    for (var i = 0; i < 5; i++) yTicks.push(Math.round(yMin + (i * (yMax - yMin)) / 4));
    var xTicks = [];
    for (var j = 0; j < 6; j++) xTicks.push(minDate + (j * (maxDate - minDate)) / 5);

    var svg = "";
    yTicks.forEach(function (t) {
      var y = yScale(t);
      svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="var(--grid)" stroke-dasharray="3 3" stroke-width="1"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--text-muted)">' + t + "</text>";
    });
    xTicks.forEach(function (t) {
      var x = xScale(t);
      svg += '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + fmtShort(new Date(t).toISOString().slice(0, 10)) + "</text>";
    });
    svg += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--baseline)" stroke-width="1"/>';

    var d = points.map(function (e, idx) {
      var x = xScale(parseISO(e.date).getTime());
      var y = yScale(e[metric.key]);
      return (idx === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    svg += '<path d="' + d + '" fill="none" stroke="' + acc.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    points.forEach(function (e) {
      var x = xScale(parseISO(e.date).getTime());
      var y = yScale(e[metric.key]);
      svg += '<circle class="chart-point" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" fill="transparent" ' +
        'data-tooltip="1" data-date="' + e.date + '" data-value="' + e[metric.key] + '" data-unit="' + metric.unit + '" data-label="' + metric.label + '" data-color="' + acc.color + '"/>';
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="' + acc.color + '" pointer-events="none"/>';
    });

    return (
      '<section class="card">' + head +
        '<div class="chart-wrap" id="chart-wrap">' +
          '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' + svg + "</svg>" +
          '<div id="chart-tooltip"></div>' +
        "</div>" +
      "</section>"
    );
  }

  /* =========================================================================
   * RENDER: Novi unos — traka s gumbom
   * =======================================================================*/
  function renderNewEntryBar(acc) {
    var last = sortedEntries(acc.entries).slice(-1)[0];
    var lastText = last ? "Zadnji unos: " + fmtFull(last.date) : "Još nema unosa nakon početnog stanja.";
    return (
      '<section class="card new-entry-bar">' +
        "<div><h2 style=\"margin:0 0 2px\">Novi unos</h2><p>" + lastText + "</p></div>" +
        '<button class="btn-primary" data-action="open-new-entry">' + icon("plus", 16) + "Novi unos</button>" +
      "</section>"
    );
  }

  /* =========================================================================
   * RENDER: Ciljevi
   * =======================================================================*/
  function renderGoals(acc) {
    var stats = computeStats(acc.entries, acc.setup.goalWeight);
    var body;
    if (stats.count === 0) {
      body = '<p class="muted">Nema podataka još.</p>';
    } else {
      var pct = stats.progressPct;
      var barHtml = "", metaHtml = "", etaHtml = "";
      if (acc.setup.goalWeight != null) {
        barHtml = '<div class="progress-track"><div class="progress-fill" style="width:' + (pct || 0) + "%;background:" + acc.color + '"></div></div>';
        var remainingText = stats.remaining != null ? (stats.remaining > 0 ? "Preostalo: " + stats.remaining.toFixed(1) + " kg" : "Cilj dosegnut 🎉") : "";
        metaHtml = '<div class="goal-meta"><span>' + (pct != null ? pct.toFixed(0) + "%" : "—") + ' do cilja</span><span>' + remainingText + "</span></div>";
        if (stats.etaWeeks != null) etaHtml = '<p class="goal-eta">Uz trenutni tempo, procjena je ~' + stats.etaWeeks + " " + (stats.etaWeeks === 1 ? "tjedan" : "tjedana") + " do cilja.</p>";
      }
      body =
        '<div class="goal-top"><div><div class="goal-current">' + stats.current.toFixed(1) + " <small>kg trenutno</small></div>" +
          '<p class="goal-start">Početna kilaža: ' + stats.start.toFixed(1) + " kg</p></div>" +
          '<div class="goal-target">' + icon("target", 15) + (acc.setup.goalWeight != null ? acc.setup.goalWeight + " kg" : "—") + "</div></div>" +
        barHtml + metaHtml + etaHtml;
    }
    return '<section class="card"><h2>Cilj</h2>' + body + "</section>";
  }

  /* =========================================================================
   * RENDER: Statistika (BMI i dr.)
   * =======================================================================*/
  function changeValueHtml(value, judged) {
    if (value == null) return '<span class="stat-value" style="color:var(--text-muted);font-size:13px">—</span>';
    var isDown = value < 0, isFlat = value === 0;
    var color = !judged ? "var(--text-secondary)" : (isFlat ? "var(--text-secondary)" : isDown ? "var(--good)" : "var(--critical)");
    var ic = isFlat ? "minus" : isDown ? "down" : "up";
    return '<span class="stat-value" style="color:' + color + '">' + icon(ic, 15) + Math.abs(value).toFixed(1) + "</span>";
  }

  function renderStats(acc) {
    var stats = computeStats(acc.entries, acc.setup.goalWeight);
    var body;
    if (stats.count === 0) {
      body = '<p class="muted">Nema podataka još.</p>';
    } else {
      var bmi = calcBMI(stats.current, acc.setup.height);
      var cat = bmiCategory(bmi);
      body =
        '<div class="stats-grid">' +
          '<div class="stat-tile"><p class="stat-label">BMI</p><span class="stat-value">' + (bmi ? bmi.toFixed(1) : "—") + '</span>' +
            '<div class="status-line" style="color:' + STATUS_COLOR[cat.status] + '"><span class="status-dot" style="background:' + STATUS_COLOR[cat.status] + '"></span>' + cat.label + "</div></div>" +
          '<div class="stat-tile"><p class="stat-label">Ukupna promjena</p>' + changeValueHtml(stats.totalChange, true) + " kg</div>" +
          '<div class="stat-tile"><p class="stat-label">Prosjek / tjedan</p>' + changeValueHtml(stats.avgWeeklyChange, true) + " kg</div>" +
          '<div class="stat-tile"><p class="stat-label">Najbolji tjedan</p>' + (stats.bestWeek ? changeValueHtml(stats.bestWeek.diff, true) + " kg" : '<span class="muted">nedovoljno podataka</span>') + "</div>" +
        "</div>" +
        '<p class="stats-count">' + stats.count + " " + (stats.count === 1 ? "unos" : "unosa") + " ukupno</p>";
    }
    return '<section class="card"><h2>Statistika kilaže</h2>' + body + "</section>";
  }

  /* =========================================================================
   * RENDER: Mjere tijela
   * =======================================================================*/
  function renderMeasurements(acc) {
    var keys = [
      { key: "trbuh", label: "Trbuh" },
      { key: "grudi", label: "Grudi" },
      { key: "noge", label: "Noge" },
      { key: "ramena", label: "Ramena" }
    ];
    var gm = acc.setup.goalMeasurements || {};
    var tiles = keys.map(function (k) {
      var d = measurementDelta(acc.entries, k.key);
      var goalVal = gm[k.key];
      var goalHtml = goalVal != null ? '<p class="muted" style="margin-top:3px">Cilj: ' + goalVal + " cm</p>" : "";
      if (!d) {
        return '<div class="stat-tile"><p class="stat-label">' + k.label + '</p><span class="stat-value" style="color:var(--text-muted);font-size:13px">—</span>' + goalHtml + "</div>";
      }
      var deltaHtml = d.delta === 0
        ? '<span class="status-line">' + icon("minus", 13) + "bez promjene</span>"
        : '<span class="status-line">' + icon(d.delta < 0 ? "down" : "up", 13) + Math.abs(d.delta).toFixed(1) + " cm od početka</span>";
      return (
        '<div class="stat-tile"><p class="stat-label">' + k.label + " (cm)</p>" +
          '<span class="stat-value">' + d.last.toFixed(1) + "</span>" + deltaHtml + goalHtml +
        "</div>"
      );
    }).join("");
    return '<section class="card"><h2>Mjere tijela</h2><div class="grid-4">' + tiles + "</div></section>";
  }

  /* =========================================================================
   * RENDER: Povijest unosa (read-only, immutable)
   * =======================================================================*/
  function renderHistory(acc) {
    var rows = sortedEntries(acc.entries).slice().reverse();
    var body;
    if (rows.length === 0) {
      body = '<p class="table-empty">Još nema unosa.</p>';
    } else {
      var trs = rows.map(function (e) {
        return (
          "<tr>" +
            '<td class="tabular-nums">' + fmtFull(e.date) + "</td>" +
            '<td class="row-weight tabular-nums">' + (e.weight != null ? e.weight.toFixed(1) + " kg" : "—") + "</td>" +
            '<td class="tabular-nums">' + (e.trbuh != null ? e.trbuh.toFixed(1) : "—") + "</td>" +
            '<td class="tabular-nums">' + (e.grudi != null ? e.grudi.toFixed(1) : "—") + "</td>" +
            '<td class="tabular-nums">' + (e.noge != null ? e.noge.toFixed(1) : "—") + "</td>" +
            '<td class="tabular-nums">' + (e.ramena != null ? e.ramena.toFixed(1) : "—") + "</td>" +
          "</tr>"
        );
      }).join("");
      body =
        '<div class="table-scroll"><table class="history"><thead><tr><th>Datum</th><th>Kilaža</th><th>Trbuh</th><th>Grudi</th><th>Noge</th><th>Ramena</th></tr></thead><tbody>' +
        trs + "</tbody></table></div>";
    }
    return (
      '<section class="card"><h2>Povijest unosa</h2>' + body +
        '<p class="lock-note">' + icon("lock", 12) + "Spremljeni unosi su trajni i ne mogu se mijenjati ni brisati.</p>" +
      "</section>"
    );
  }

  /* =========================================================================
   * RENDER: Profil — info o računu + uređivanje ciljne kilaže/mjera i podataka
   * =======================================================================*/
  function renderProfilePage(acc) {
    var stats = computeStats(acc.entries, acc.setup.goalWeight);
    var gm = acc.setup.goalMeasurements || {};
    return (
      '<section class="card">' +
        '<div class="profile-head"><div class="profile-avatar" style="background:' + acc.color + '">' + acc.name.charAt(0) + "</div>" +
          "<div><strong>" + acc.name + "</strong><span>Postavljeno " + fmtFull(acc.setup.setupDate) + "</span></div></div>" +
        '<div class="profile-meta">' +
          '<div class="stat-tile"><p class="stat-label">Trenutna kilaža</p><span class="stat-value">' + (stats.current != null ? stats.current.toFixed(1) + " kg" : "—") + "</span></div>" +
          '<div class="stat-tile"><p class="stat-label">Broj unosa</p><span class="stat-value">' + stats.count + "</span></div>" +
        "</div>" +
      "</section>" +
      '<section class="card">' +
        "<h2>Podaci i ciljevi</h2>" +
        '<form id="profile-form">' +
          '<div class="wizard-grid">' +
            '<label class="field">Visina (cm)<input type="number" name="height" value="' + acc.setup.height + '" /></label>' +
            '<label class="field">Ciljna kilaža (kg)<input type="text" inputmode="decimal" name="goalWeight" value="' + acc.setup.goalWeight + '" /></label>' +
          "</div>" +
          '<p class="wizard-section-label">Željena mjera (cm)</p>' +
          '<div class="wizard-grid">' +
            '<label class="field">Trbuh<input type="text" inputmode="decimal" name="goalTrbuh" value="' + (gm.trbuh != null ? gm.trbuh : "") + '" /></label>' +
            '<label class="field">Grudi<input type="text" inputmode="decimal" name="goalGrudi" value="' + (gm.grudi != null ? gm.grudi : "") + '" /></label>' +
            '<label class="field">Noge<input type="text" inputmode="decimal" name="goalNoge" value="' + (gm.noge != null ? gm.noge : "") + '" /></label>' +
            '<label class="field">Ramena<input type="text" inputmode="decimal" name="goalRamena" value="' + (gm.ramena != null ? gm.ramena : "") + '" /></label>' +
          "</div>" +
          (state.profileError ? '<p class="form-error">' + state.profileError + "</p>" : "") +
          '<button type="submit" class="btn-primary" style="width:100%;margin-top:16px">Spremi promjene</button>' +
        "</form>" +
      "</section>" +
      '<section class="card" style="display:flex;flex-direction:column;gap:8px">' +
        '<button class="btn-secondary" data-action="switch-user">' + icon("users", 15) + "Promijeni korisnika</button>" +
        '<button class="btn-secondary btn-danger" data-action="reset-account">' + icon("rotate", 15) + "Resetiraj ovaj račun</button>" +
      "</section>"
    );
  }

  /* =========================================================================
   * RENDER: Jelovnik — "Kreiraj jelo" (AI prijedlog recepta za dvoje)
   * =======================================================================*/
  function renderMealTab() {
    var listHtml = "";
    var detailHtml = "";

    if (state.lastMeal) {
      var m = state.lastMeal;
      var d = m.dish;
      detailHtml =
        '<section class="card">' +
          (state.mealOptions ? '<button class="btn-secondary" data-action="back-to-meal-options" style="margin-bottom:16px">← Natrag na popis jela</button>' : "") +
          "<h2 style=\"text-align:center\">" + d.name + "</h2>" +
          '<p class="muted" style="margin:0 0 14px;text-align:center">' + proteinLabel(m.protein) + " + " + prilogLabel(m.prilog) + " — količine za 2 osobe</p>" +
          '<div class="stats-grid" style="margin-bottom:16px">' +
            '<div class="stat-tile"><p class="stat-label">Kalorije (po osobi)</p><span class="stat-value">' + d.kcal + " kcal</span></div>" +
            '<div class="stat-tile"><p class="stat-label">Proteini (po osobi)</p><span class="stat-value">' + d.protein + " g</span></div>" +
            '<div class="stat-tile"><p class="stat-label">Ugljikohidrati (po osobi)</p><span class="stat-value">' + d.carbs + " g</span></div>" +
            '<div class="stat-tile"><p class="stat-label">Masti (po osobi)</p><span class="stat-value">' + d.fat + " g</span></div>" +
          "</div>" +
          '<p class="wizard-section-label" style="margin-top:0">Namirnice</p>' +
          '<ul class="ingredient-list" style="margin-bottom:16px">' + d.ingredients.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>" +
          '<p class="wizard-section-label">Priprema</p>' +
          '<ol class="steps-list">' + d.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>" +
          '<p class="modal-note" style="margin-top:16px">Nutritivne vrijednosti su draft procjene (unaprijed pripremljene) — precizne vrijednosti dolaze kad spojimo pravi backend.</p>' +
        "</section>";
    } else if (state.mealOptions && state.mealOptionsMeta) {
      var meta = state.mealOptionsMeta;
      var options = state.mealOptions.map(function (opt, idx) {
        return (
          '<button class="meal-option" data-action="select-dish" data-id="' + idx + '">' +
            '<span class="meta"><strong>' + opt.name + '</strong><span>' + opt.kcal + " kcal · " + opt.protein + "P / " + opt.carbs + "UH / " + opt.fat + "M g (po osobi)</span></span>" +
          "</button>"
        );
      }).join("");
      listHtml =
        '<section class="card">' +
          "<h2>" + proteinLabel(meta.protein) + " + " + prilogLabel(meta.prilog) + " — odaberi jelo</h2>" +
          '<p class="muted" style="margin:0 0 14px">10 prijedloga jela za ovu kombinaciju. Klikni na jelo za detaljan recept i postupak pripreme.</p>' +
          '<div class="meal-option-list">' + options + "</div>" +
        "</section>";
    }

    return (
      '<section class="card">' +
        "<h2>Kreiraj jelo</h2>" +
        '<p class="muted" style="margin:0 0 14px">Odaberi meso i prilog — dobit ćeš 10 prijedloga jela; klikom na jedno dobiješ detaljan recept, izgled, postupak pripreme i kalorijske vrijednosti za dvoje.</p>' +
        '<button class="btn-primary" data-action="open-meal-modal">' + icon("meal", 16) + "Kreiraj jelo</button>" +
      "</section>" +
      listHtml +
      detailHtml
    );
  }

  function renderMealModal() {
    if (!state.mealModalOpen) return "";
    var proteinBtns = PROTEINS.map(function (p) {
      var active = state.mealForm.protein === p.key;
      return '<button type="button" class="' + (active ? "active" : "") + '" data-action="meal-protein" data-id="' + p.key + '">' + p.label + "</button>";
    }).join("");
    var prilogBtns = PRILOZI.map(function (p) {
      var active = state.mealForm.prilog === p.key;
      return '<button type="button" class="' + (active ? "active" : "") + '" data-action="meal-prilog" data-id="' + p.key + '">' + p.label + "</button>";
    }).join("");
    return (
      '<div class="modal-backdrop" data-action="close-meal-modal">' +
        '<div class="modal" data-action="noop">' +
          '<div class="modal-head"><h2>Kreiraj jelo</h2><button class="icon-btn" data-action="close-meal-modal" aria-label="Zatvori">' + icon("x", 17) + "</button></div>" +
          '<p class="modal-sub">Odaberi meso i prilog za dvoje</p>' +
          '<p class="wizard-section-label" style="margin-top:0">Meso</p>' +
          '<div class="choice-pills">' + proteinBtns + "</div>" +
          '<p class="wizard-section-label">Prilog</p>' +
          '<div class="choice-pills">' + prilogBtns + "</div>" +
          '<button class="btn-primary" style="width:100%;margin-top:18px" data-action="generate-meal">' + icon("check", 16) + "Prikaži 10 opcija jela</button>" +
          '<p class="modal-note">Draft: 10 varijanti recepata po kombinaciji, generirano iz unaprijed pripremljene liste. Kad spojimo pravi AI backend, recepti će se generirati dinamički.</p>' +
        "</div>" +
      "</div>"
    );
  }

  /* =========================================================================
   * RENDER: Popup "Novi unos"
   * =======================================================================*/
  function renderNewEntryModal(acc) {
    if (!state.newEntryOpen) return "";
    return (
      '<div class="modal-backdrop" data-action="close-new-entry">' +
        '<div class="modal" data-action="noop">' +
          '<div class="modal-head"><h2>Novi unos</h2><button class="icon-btn" data-action="close-new-entry" aria-label="Zatvori">' + icon("x", 17) + "</button></div>" +
          '<p class="modal-sub">' + fmtFull(todayISO()) + " — " + acc.name + "</p>" +
          '<form id="entry-form">' +
            '<label class="field" style="margin-bottom:10px">Kilaža (kg)<input type="text" inputmode="decimal" name="weight" placeholder="npr. 82.4" /></label>' +
            '<div class="modal-grid">' +
              '<label class="field">Trbuh (cm)<input type="text" inputmode="decimal" name="trbuh" /></label>' +
              '<label class="field">Grudi (cm)<input type="text" inputmode="decimal" name="grudi" /></label>' +
              '<label class="field">Noge (cm)<input type="text" inputmode="decimal" name="noge" /></label>' +
              '<label class="field">Ramena (cm)<input type="text" inputmode="decimal" name="ramena" /></label>' +
            "</div>" +
            (state.entryError ? '<p class="form-error">' + state.entryError + "</p>" : "") +
            '<button type="submit" class="btn-primary" style="width:100%;margin-top:16px">' + icon("check", 16) + "Potvrdi unos</button>" +
          "</form>" +
          '<p class="modal-note">Nakon potvrde unos se sprema trajno i više se ne može mijenjati ni brisati.</p>' +
        "</div>" +
      "</div>"
    );
  }

  /* =========================================================================
   * APP RENDER
   * =======================================================================*/
  function renderTabContent(acc) {
    if (state.activeTab === "povijest") {
      return renderNewEntryBar(acc) + renderHistory(acc);
    }
    if (state.activeTab === "profil") {
      return renderProfilePage(acc);
    }
    if (state.activeTab === "jelovnik") {
      return renderMealTab();
    }
    // dashboard (default) — početna + trend zajedno
    return (
      renderTrendChart(acc) +
      '<div class="grid-2">' + renderGoals(acc) + renderStats(acc) + "</div>" +
      renderMeasurements(acc)
    );
  }

  function renderSyncScreen() {
    if (state.syncError) {
      return (
        '<div class="sync-screen">' +
          '<div class="sync-error">' + state.syncError + "</div>" +
        "</div>"
      );
    }
    return (
      '<div class="sync-screen"><div class="sync-spinner"></div><p>Spajanje na bazu…</p></div>'
    );
  }

  function renderSyncBadge() {
    if (state.syncError) {
      return '<div class="sync-badge"><span class="dot" style="background:var(--critical)"></span>Bez veze</div>';
    }
    return '<div class="sync-badge"><span class="dot" style="background:var(--good)"></span>Sinkronizirano</div>';
  }

  function render() {
    try {
      if (!state.syncReady) {
        document.getElementById("app").innerHTML = renderHeader() + renderSyncScreen();
        return;
      }
      var acc = currentAccount();
      var body;
      if (!acc) {
        body = '<main>' + renderProfilePicker() + "</main>";
      } else if (!acc.setup) {
        body = '<main>' + renderSetupWizard(acc) + "</main>";
      } else {
        body =
          renderSidebar(acc) +
          '<main class="wrap with-bottom-nav">' + renderTabContent(acc) + "</main>" +
          renderBottomNav() +
          renderNewEntryModal(acc) +
          renderMealModal();
      }
      document.getElementById("app").innerHTML = renderHeader() + body + renderSyncBadge();
    } catch (err) {
      // Sigurnosna mreža: umjesto tihog "ništa se ne događa", prikaži grešku
      // da je odmah vidljivo što je pošlo po zlu (i meni i tebi kod testiranja).
      if (window.console && console.error) console.error(err);
      document.getElementById("app").innerHTML =
        '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;color:#d03b3b;font-size:12px;line-height:1.5;">' +
        "Greška u prikazu — javi ovo:\n\n" + (err && err.message ? err.message : String(err)) +
        "</div>";
    }
  }

  /* =========================================================================
   * EVENTS
   * =======================================================================*/
  var app = document.getElementById("app");

  app.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "setup-form") {
      e.preventDefault();
      var fd = new FormData(e.target);
      var height = num(fd.get("height"));
      var startWeight = num(fd.get("startWeight"));
      var goalWeight = num(fd.get("goalWeight"));
      if (!height || height < 100 || height > 250) { state.setupError = "Unesi ispravnu visinu (cm)."; render(); return; }
      if (!startWeight || startWeight <= 0 || startWeight > 400) { state.setupError = "Unesi ispravnu trenutnu kilažu."; render(); return; }
      if (!goalWeight || goalWeight <= 0 || goalWeight > 400) { state.setupError = "Unesi ispravnu željenu kilažu."; render(); return; }
      state.setupError = "";

      var acc = currentAccount();
      var newSetup = { height: height, goalWeight: goalWeight, goalMeasurements: { trbuh: null, grudi: null, noge: null, ramena: null }, setupDate: todayISO() };
      var firstEntry = {
        id: uid(),
        date: todayISO(),
        weight: startWeight,
        trbuh: num(fd.get("trbuh")),
        grudi: num(fd.get("grudi")),
        noge: num(fd.get("noge")),
        ramena: num(fd.get("ramena"))
      };
      acc.setup = newSetup;
      acc.entries.push(firstEntry);
      saveAccount(acc.id, { setup: newSetup, entries: arrayUnion(firstEntry) });
      render();
    }
    if (e.target && e.target.id === "entry-form") {
      e.preventDefault();
      var fd2 = new FormData(e.target);
      var weight = num(fd2.get("weight"));
      if (!weight || weight <= 0 || weight > 400) { state.entryError = "Unesi ispravnu kilažu (npr. 82.4)."; render(); return; }
      state.entryError = "";
      var acc2 = currentAccount();
      var newEntry = {
        id: uid(),
        date: todayISO(),
        weight: weight,
        trbuh: num(fd2.get("trbuh")),
        grudi: num(fd2.get("grudi")),
        noge: num(fd2.get("noge")),
        ramena: num(fd2.get("ramena"))
      };
      acc2.entries.push(newEntry);
      saveAccount(acc2.id, { entries: arrayUnion(newEntry) });
      state.newEntryOpen = false;
      render();
    }
    if (e.target && e.target.id === "profile-form") {
      e.preventDefault();
      var fd3 = new FormData(e.target);
      var height2 = num(fd3.get("height"));
      var goalWeight2 = num(fd3.get("goalWeight"));
      if (!height2 || height2 < 100 || height2 > 250) { state.profileError = "Unesi ispravnu visinu."; render(); return; }
      if (!goalWeight2 || goalWeight2 <= 0 || goalWeight2 > 400) { state.profileError = "Unesi ispravnu ciljnu kilažu."; render(); return; }
      state.profileError = "";
      var acc3 = currentAccount();
      acc3.setup.height = height2;
      acc3.setup.goalWeight = goalWeight2;
      acc3.setup.goalMeasurements = {
        trbuh: num(fd3.get("goalTrbuh")),
        grudi: num(fd3.get("goalGrudi")),
        noge: num(fd3.get("goalNoge")),
        ramena: num(fd3.get("goalRamena"))
      };
      saveAccount(acc3.id, { setup: acc3.setup });
      render();
    }
  });

  app.addEventListener("click", function (e) {
    var actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    var id = actionEl.getAttribute("data-id");

    if (action === "select-account") {
      state.currentAccountId = id;
      state.chartMetric = "weight";
      state.activeTab = "dashboard";
      render();
    } else if (action === "toggle-sidebar") {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    } else if (action === "close-sidebar") {
      state.sidebarOpen = false;
      render();
    } else if (action === "nav") {
      state.activeTab = id;
      state.sidebarOpen = false;
      render();
    } else if (action === "switch-user") {
      state.currentAccountId = null;
      state.sidebarOpen = false;
      state.activeTab = "dashboard";
      render();
    } else if (action === "reset-account") {
      if (!confirm("Resetirati ovaj račun (trajno briše setup i sve unose iz baze)?")) return;
      var accId = state.currentAccountId;
      var acc = state.accounts[accId];
      state.accounts[accId] = { id: accId, name: acc.name, color: acc.color, setup: null, entries: [] };
      saveAccount(accId, { setup: null, entries: [] });
      state.sidebarOpen = false;
      render();
    } else if (action === "open-new-entry") {
      state.entryError = "";
      state.newEntryOpen = true;
      state.sidebarOpen = false;
      render();
    } else if (action === "close-new-entry") {
      state.newEntryOpen = false;
      render();
    } else if (action === "chart-metric") {
      state.chartMetric = id;
      render();
    } else if (action === "open-meal-modal") {
      state.mealModalOpen = true;
      state.sidebarOpen = false;
      render();
    } else if (action === "close-meal-modal") {
      state.mealModalOpen = false;
      render();
    } else if (action === "meal-protein") {
      state.mealForm.protein = id;
      render();
    } else if (action === "meal-prilog") {
      state.mealForm.prilog = id;
      render();
    } else if (action === "generate-meal") {
      state.mealOptions = getMealOptions(state.mealForm.protein, state.mealForm.prilog);
      state.mealOptionsMeta = { protein: state.mealForm.protein, prilog: state.mealForm.prilog };
      state.lastMeal = null;
      state.mealModalOpen = false;
      render();
    } else if (action === "select-dish") {
      if (state.mealOptions && state.mealOptionsMeta) {
        var dishIdx = parseInt(id, 10);
        state.lastMeal = { protein: state.mealOptionsMeta.protein, prilog: state.mealOptionsMeta.prilog, dish: state.mealOptions[dishIdx] };
      }
      render();
    } else if (action === "back-to-meal-options") {
      state.lastMeal = null;
      render();
    }
  });

  // Tooltip za graf
  app.addEventListener("mouseover", function (e) {
    var pt = e.target.closest && e.target.closest("[data-tooltip]");
    if (!pt) return;
    var wrap = document.getElementById("chart-wrap");
    var tooltip = document.getElementById("chart-tooltip");
    if (!wrap || !tooltip) return;
    var rect = wrap.getBoundingClientRect();
    var x = e.clientX - rect.left, y = e.clientY - rect.top;
    tooltip.innerHTML =
      '<div class="tt-date">' + fmtFull(pt.getAttribute("data-date")) + "</div>" +
      '<div class="tt-row">' + pt.getAttribute("data-label") + ': <span class="tt-val">' +
      Number(pt.getAttribute("data-value")).toFixed(1) + " " + pt.getAttribute("data-unit") + "</span></div>";
    tooltip.style.display = "block";
    tooltip.style.left = Math.min(x + 12, rect.width - 150) + "px";
    tooltip.style.top = Math.max(y - 40, 0) + "px";
  });
  app.addEventListener("mouseout", function (e) {
    var pt = e.target.closest && e.target.closest("[data-tooltip]");
    if (!pt) return;
    var tooltip = document.getElementById("chart-tooltip");
    if (tooltip) tooltip.style.display = "none";
  });

  render();
  initFirebaseSync();
})();
</script>
</body>
</html>
